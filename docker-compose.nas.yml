services:
  backend:
    image: ghcr.io/peterhgg/live-web-mvp-backend:latest
    container_name: live-web-mvp-backend
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    image: ghcr.io/peterhgg/live-web-mvp-frontend:latest
    container_name: live-web-mvp-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
